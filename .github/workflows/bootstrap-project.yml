name: Bootstrap PokemonSearch project

on:
  push:
    paths:
      - '.github/workflows/bootstrap-project.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand Phase 1-4 project
        shell: pwsh
        run: |
          $parts = @(
            '.bootstrap/part01.b64',
            '.bootstrap/part02.b64',
            '.bootstrap/part03.b64',
            '.bootstrap/rem01.b64',
            '.bootstrap/rem02.b64',
            '.bootstrap/rem03.b64',
            '.bootstrap/rem04.b64',
            '.bootstrap/rem05.b64',
            '.bootstrap/rem06.b64',
            '.bootstrap/rem07.b64',
            '.bootstrap/rem08.b64'
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes('project.zip', [Convert]::FromBase64String($b64))
          Expand-Archive project.zip -DestinationPath extracted -Force
          Copy-Item extracted/PokemonSearch/* . -Recurse -Force
          Copy-Item extracted/PokemonSearch/.gitignore . -Force
          Copy-Item extracted/PokemonSearch/.github . -Recurse -Force
          Remove-Item project.zip -Force
          Remove-Item extracted -Recurse -Force
          Remove-Item .bootstrap -Recurse -Force
          Remove-Item .github/workflows/bootstrap-project.yml -Force

      - name: Commit expanded project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PokemonSearch Phase 1-4 implementation"
          git push
