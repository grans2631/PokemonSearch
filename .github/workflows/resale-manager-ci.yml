name: Resale Manager CI

on:
  push:
    paths:
      - "resale-manager/**"
      - ".github/workflows/resale-manager-ci.yml"
  pull_request:
    paths:
      - "resale-manager/**"
      - ".github/workflows/resale-manager-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resale-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest
